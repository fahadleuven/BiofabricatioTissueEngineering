<div id="profile-container" class="max-w-3xl mx-auto py-16 px-6"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>




<script src="/js/supabase.js"></script>

<script>
async function loadProfile() {
  const slug = new URLSearchParams(window.location.search).get("slug");
  if (!slug) return;

  const { data, error } = await supabaseClient
    .from("staff_profiles")
    .select("*")
    .eq("slug", slug)
    .single();

  if (error) {
    console.error(error);
    return;
  }
document.title = data.full_name + " - Profile";
  const container = document.getElementById("profile-container");

  container.innerHTML = `
    <div class="bg-white shadow-xl rounded-xl overflow-hidden">

      <div class="w-full bg-gray-200 flex justify-center">
        <img src="${data.photo_url}"
             alt="${data.full_name}"
             class="w-full max-w-sm object-contain p-6">
      </div>

      <div class="p-8">

        <h1 class="text-3xl font-bold text-gray-800 mb-4 text-center">
          ${data.full_name}
        </h1>

        <p class="text-gray-700 leading-relaxed text-lg">
          ${data.bio}
        </p>

        <div class="mt-8 space-y-3">
          ${data.scholar_url ? `
            <a href="${data.scholar_url}" target="_blank"
               class="block w-full text-center py-3 rounded-lg bg-purple-600 text-white font-medium hover:bg-purple-700 transition">
              Google Scholar
            </a>` : ""}

          ${data.linkedin_url ? `
            <a href="${data.linkedin_url}" target="_blank"
               class="block w-full text-center py-3 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition">
              LinkedIn
            </a>` : ""}

          ${data.ku_url ? `
            <a href="${data.ku_url}" target="_blank"
               class="block w-full text-center py-3 rounded-lg bg-gray-800 text-white font-medium hover:bg-black transition">
              KU Leuven “Who is Who”
            </a>` : ""}
        </div>

      </div>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", loadProfile);

async function loadNavbarCategories() {
  const { data } = await supabaseClient
    .from("research_categories")
    .select("title, slug")
    .eq("active", true)
    .order("sort_order", { ascending: true });

  const container = document.getElementById("research-dropdown");

  data.forEach(cat => {
    container.insertAdjacentHTML("beforeend", `
      <a href="/research-category?slug=${cat.slug}"
         class="dropdown-item">
        ${cat.title}
      </a>
    `);
  });
}

document.addEventListener("DOMContentLoaded", loadNavbarCategories);


async function loadMobileOverviewCategories() {

  const { data, error } = await supabaseClient
    .from("research_categories")
    .select("title, slug")
    .eq("active", true)
    .order("sort_order", { ascending: true });

  if (error) {
    console.error("Mobile overview fetch error:", error);
    return;
  }

  const overviewMenu = document.getElementById("overview-menu");
  overviewMenu.innerHTML = "";

  data.forEach(category => {
    overviewMenu.insertAdjacentHTML("beforeend", `
      <a href="/research-category?slug=${category.slug}"
         class="block py-1 text-gray-700 hover:text-orange-600">
        ${category.title}
      </a>
    `);
  });
}
document.addEventListener("DOMContentLoaded", () => {
  loadMobileOverviewCategories();
});



/* //fetch footer and insert into page */
fetch('../components/footer.html')
  .then(res => res.text())
  .then(data => {
    document.getElementById('footer').innerHTML = data;
  });
</script>
